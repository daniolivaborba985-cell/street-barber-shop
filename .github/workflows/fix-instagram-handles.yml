name: Fix Instagram handles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-instagram-handles.yml'

permissions:
  contents: write

jobs:
  fix-handles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Instagram handles
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/publicSite.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '@luan_barbeer': '@luan_baarbeer',
              '@kaua_barbeer': '@kaua_baarbeer',
              '@bruninho_barbeer': '@bruninho_baarbeer',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Valor esperado não encontrado: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/publicSite.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: update barber Instagram handles"
          git push
